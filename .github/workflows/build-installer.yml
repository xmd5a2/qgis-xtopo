name: build-installer

# Сборка инсталлятора QGIS-xtopo для Windows (Inno Setup).
#
# Инсталлятор проверяет наличие QGIS, при необходимости предлагает
# скачать и установить его, ставит плагин в профиль QGIS, включает его
# и создаёт ярлык на рабочем столе.
#
# Результат: qgis-xtopo-setup-<версия>.exe в dist/.

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - "installer/**"
      - "core/**"
      - "gui/**"
      - "resources/**"
      - "metadata.txt"
      - "tools/build_plugin.py"
      - ".github/workflows/build-installer.yml"

jobs:
  windows:
    name: инсталлятор для Windows
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Установка Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Сборка инсталлятора
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $log = Join-Path $env:RUNNER_TEMP 'build-installer.log'
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          try {
            # Имя каталога с «(x86)» PowerShell читает только в фигурных
            # скобках: без них `$env:ProgramFiles(x86)` — ошибка разбора.
            $inno = "${env:ProgramFiles(x86)}\Inno Setup 6"
            if (Test-Path $inno) { $env:Path += ";$inno" }
            $env:PYTHONIOENCODING = "utf-8"
            "python: $(python --version 2>&1)" | Tee-Object -FilePath $log
            "ISCC: $((Get-Command ISCC.exe -ErrorAction SilentlyContinue).Source)" |
              Tee-Object -FilePath $log -Append
            & ./installer/build-installer.ps1 *>&1 | Tee-Object -FilePath $log -Append
            if ($LASTEXITCODE -ne 0) { throw "build-installer.ps1: код $LASTEXITCODE" }
          }
          catch {
            $_ | Out-String | Tee-Object -FilePath $log -Append
            "### Сборка инсталлятора`n```" + (Get-Content $log -Raw) + "```" |
              Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
            exit 1
          }

      - name: Проверка результата
        shell: pwsh
        run: |
          $version = (Select-String -Path metadata.txt -Pattern '^version=').Line -replace '^version=', ''
          $setup = "dist/qgis-xtopo-setup-$version.exe"
          if (-not (Test-Path $setup)) { throw "Инсталлятор не собран: $setup" }
          Get-Item $setup | Select-Object Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: qgis-xtopo-setup
          path: dist/qgis-xtopo-setup-*.exe
